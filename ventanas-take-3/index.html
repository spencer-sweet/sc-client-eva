<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ventanas Take 3</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- #star-scene, #bar, #help, #err are mounted by src/dev-helpers/ so the
         same controls work when only the built main.js is loaded from CDN. -->

    <!-- Scroll-driven timeline runway. Invisible spacers -- the fixed #star-scene canvas
         renders on top the whole time; scrolling past these just advances the
         Theatre.js sequence (see measureCards() in src/timeline-scroll.ts). -->
    <section data-fs-section="10" data-fs-section-title="who-we-are">
      <div data-fs-card="1010"></div>
      <div data-fs-card="1020" data-fs-duration="10"></div>
      <div data-fs-card="1030"></div>
      <div data-fs-card="1040"></div>
      <div data-fs-card="1050"></div>
    </section>
    <section data-fs-section="20" data-fs-section-title="how-it-works">
      <div data-fs-card="2010"></div>
      <div data-fs-card="2020"></div>
      <div data-fs-card="2030"></div>
      <div data-fs-card="2040"></div>
      <div data-fs-card="2050"></div>
    </section>
    <section data-fs-section="30" data-fs-section-title="use-cases">
      <div data-fs-card="3010"></div>
    </section>
    <section data-fs-section="40" data-fs-section-title="where-we-fit">
      <div data-fs-card="4010"></div>
    </section>
    <section data-fs-section="50" data-fs-section-title="next-steps">
      <div data-fs-card="5010"></div>
    </section>
    <section data-fs-section="60" data-fs-section-title="footer">
      <div data-fs-card="6010"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
