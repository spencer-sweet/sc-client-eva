<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.25/dist/lenis.css" />
<script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script>
<script src="https://unpkg.com/lenis@1.3.25/dist/lenis-snap.min.js"></script>
<script>
  const lenis = new Lenis({
    autoRaf: true,
    autoToggle: true,
    anchors: true,
    allowNestedScroll: true,
    naiveDimensions: true,
    stopInertiaOnNavigate: true,
    lerp: 0.25,
  });

  window.lenis = lenis; // in case the scene object needs to access it make it global

  document.addEventListener('DOMContentLoaded', function() {
    const logScroll = new URLSearchParams(location.search).has('logScroll');

    // data-fs-section values are AABB codes:
    //   AA = outer section (10, 20, 30…)
    //   BB = inner card   (10, 20, 30…)
    // e.g. 1010 = §1 card1, 1020 = §1 card2, 3010 = §3 card1
    const snapTargets = sortedByData('[data-fs-card]', 'fsCard');

    // --- initialize lenis scroll snapping ---
    const snap = new Snap(lenis, {type: 'proximity', distanceThreshold: '20%'});
    // snap.addElements(snapTargets, {align: ['start', 'end']}); // start + end or just end?
    snap.addElements(snapTargets, {align: ['start']});

    setupActiveSectionMenu(logScroll);

    if (logScroll) {
      setupScrollDebug(snapTargets);
    }
  });

  function sortedByData(selector, attr) {
    return Array.from(document.querySelectorAll(selector)).sort(function(a, b) {
      return Number(a.dataset[attr]) - Number(b.dataset[attr]);
    });
  }

  function clamp01pct(value) {
    return Math.min(100, Math.max(0, value));
  }

  // Same per-element "how much of this element has scrolled through the viewport"
  // calc for both [data-fs-card] and [data-fs-section] lists.
  function measureElements(els, idAttr, scrollY, into) {
    const vh = window.innerHeight;
    let firstTopAbs = null;
    let lastBottomAbs = null;

    for (let i = 0; i < els.length; i++) {
      const el = els[i];
      const rect = el.getBoundingClientRect();
      into.set(el.dataset[idAttr], clamp01pct(((vh - rect.top) / rect.height) * 100));

      const topAbs = rect.top + scrollY;
      const bottomAbs = rect.bottom + scrollY;
      if (i === 0) firstTopAbs = topAbs;
      if (i === els.length - 1) lastBottomAbs = bottomAbs;
    }

    if (firstTopAbs === null) return 0;
    const startScroll = firstTopAbs - vh;
    const range = lastBottomAbs - vh - startScroll;
    if (range <= 0) return 0;
    return clamp01pct(((scrollY - startScroll) / range) * 100);
  }

  function setupScrollDebug(snapTargets) {
    // Separate tracking for the outer [data-fs-section] elements themselves.
    const sectionTargets = sortedByData('[data-fs-section]', 'fsSection');
    const cardIds = snapTargets.map(function(el) {
      return el.dataset.fsCard;
    });
    const sectionIds = sectionTargets.map(function(el) {
      return el.dataset.fsSection;
    });
    const cardProgress = new Map();
    const sectionProgress = new Map();

    function publish(scrollY, velocity) {
      const global = measureElements(snapTargets, 'fsCard', scrollY, cardProgress);
      const sectionsGlobal = measureElements(sectionTargets, 'fsSection', scrollY, sectionProgress);
      window.fsDevScroll = {
        scrollY: scrollY,
        velocity: velocity,
        global: global / 100,
        progress: Object.fromEntries(cardProgress),
        sectionsGlobal: sectionsGlobal / 100,
        sections: Object.fromEntries(sectionProgress),
      };
      return global;
    }

    console.log('[fs-dev] lenis snap targets', cardIds.length, cardIds);
    console.log('[fs-dev] section targets', sectionIds.length, sectionIds);

    publish(lenis.scroll, 0);
    console.log('[fs-dev] scroll data available at window.fsDevScroll', window.fsDevScroll);

    let logTick = 0;
    lenis.on('scroll', function(e) {
      const global = publish(e.scroll, e.velocity);
      logTick++;
      if (logTick % 30 !== 0) return;
      console.debug('[fs-dev] scroll', {
        scrollY: e.scroll.toFixed(1),
        velocity: e.velocity.toFixed(2),
        global: global.toFixed(1) + '%',
        sections: Object.fromEntries(cardProgress),
        sectionsOnly: Object.fromEntries(sectionProgress),
      });
    });
  }

  // Nav: mark [data-fs-section-link] is-active from IntersectionObserver (not Lenis scroll).
  function setupActiveSectionMenu(logScroll) {
    const sectionEls = Array.from(document.querySelectorAll('[data-fs-section]'));
    const menuLinks = Array.from(document.querySelectorAll('[data-fs-section-link]'));
    if (!sectionEls.length || !menuLinks.length) return;

    const linkBySection = new Map();
    for (let i = 0; i < menuLinks.length; i++) {
      linkBySection.set(menuLinks[i].dataset.fsSectionLink, menuLinks[i]);
    }

    // Most-visible section wins when two overlap.
    const visibleRatios = new Map();

    function setActiveLink(sectionId) {
      for (const [id, link] of linkBySection) {
        link.classList.toggle('is-active', id === sectionId);
      }
    }

    function updateActiveFromRatios() {
      let bestId = null;
      let bestRatio = 0;
      for (const [id, ratio] of visibleRatios) {
        if (ratio > bestRatio) {
          bestRatio = ratio;
          bestId = id;
        }
      }
      if (bestId !== null) setActiveLink(bestId);
    }

    // 0, 0.05, 0.1 … 1 so IntersectionObserver fires on every 5% visibility change.
    const thresholds = [];
    for (let t = 0; t <= 1; t += 0.05) thresholds.push(Number(t.toFixed(2)));

    const observer = new IntersectionObserver(
      function(entries) {
        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i];
          visibleRatios.set(
            entry.target.dataset.fsSection,
            entry.isIntersecting ? entry.intersectionRatio : 0
          );
        }
        updateActiveFromRatios();
      },
      {
        // only trigger new "is-active" for current nav link in middle of the screen
        rootMargin: '-45% 0px -45% 0px',
        threshold: thresholds,
      }
    );

    for (let i = 0; i < sectionEls.length; i++) observer.observe(sectionEls[i]);

    if (logScroll) {
      console.log('[fs-dev] active-menu sections', sectionEls.length, 'links', menuLinks.length);
    }
  }
</script>
